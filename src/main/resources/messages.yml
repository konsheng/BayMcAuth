# 消息格式为 MiniMessage
# 前缀中的标签应完整闭合, 消息中使用 <prefix> 引用此前缀, 使用 <newline> 换行
# 预览与编辑: https://webui.adventure.kyori.net/
prefix: "BayMcAuth <gold>>></gold> "

messages:
  reload: "<prefix><green>配置重载成功</green>"
  error-occurred: "<prefix><red>发生内部错误</red>"
  ratelimited: "<prefix><red>请稍候再试</red>"
  database-error-kick: "<prefix><red>发生数据库错误</red>"
  not-player: "<prefix><red>此命令只能由玩家执行</red>"
  not-registered: "<prefix><red>您尚未注册, 或当前账号为 </red><gold>正版账号</gold>"
  cracked-command: "<prefix><newline><green>无法使用此命令, 因为您的账号为 </green><gold>正版账号</gold>"
  wrong-password: "<prefix><red>密码错误</red>"
  password-changed-kick: "<prefix><yellow>您的密码已修改, 请重新连接并使用新密码登录</yellow>"
  nickname-invalid-kick: "<prefix><white><newline></white><red>您的名称包含不允许的字符, 请修改名称</red>"
  reconnect-kick: "<prefix><white><newline></white><red>请重新连接服务器以验证账号</red>"
  ip-limit-kick: "<prefix><white><newline><newline></white><red>您的 IP 注册账号频繁, 请稍后再试</red>"
  wrong-nickname-case-kick: "<prefix><white><newline></white><red>请使用用户名 </red><gold><expected_name></gold><red> 登录, 而不是 </red><gold><current_name></gold>"
  bossbar: "<prefix><white>您还有</white> <gold><seconds></gold> <white>秒完成登录</white>"
  times-up: "<prefix><white><newline></white><red>认证超时</red>"
  login-premium: "<prefix><white>已通过正版账号自动登录</white>"
  login-premium-title: "<prefix><white>欢迎</white>"
  login-premium-subtitle: "<green>您已作为正版玩家登录</green>"
  login-floodgate: "<prefix><white>已通过基岩版账号自动登录</white>"
  login-floodgate-title: "<prefix><white>欢迎</white>"
  login-floodgate-subtitle: "<green>您已作为基岩版玩家登录</green>"
  login: "<prefix><green>请使用</green> <gold>/login <密码></gold> <green>进行登录, 您还有</green> <gold><attempts></gold> <green>次尝试机会</green>"
  login-wrong-password: "<prefix><red>密码错误, 您还有 </red><gold><attempts> </gold><red>次尝试机会</red>"
  login-wrong-password-kick: "<prefix><white><newline></white><red>密码错误次数过多</red>"
  login-successful: "<prefix><green>登录成功</green>"
  # 可以为空, 可使用 <attempts> 表示初始登录尝试次数
  login-title: "<white>请使用</white> <gold>/login <密码></gold> <green>登录</green>"
  login-subtitle: "<green>您还有</green> <gold><attempts></gold> <green>次尝试机会</green>"
  login-successful-title: "<prefix>"
  login-successful-subtitle: "<green>登录成功</green>"
  # 如果 register-need-repeat-password 设置为 false, 请移除 <重复密码> 参数
  register: "<prefix><white>请使用</white> <gold>/register <密码> <重复密码> 进行注册</gold>"
  register-different-passwords: "<prefix><red>两次输入的密码不一致</red>"
  register-password-too-short: "<prefix><red>密码过短, 请使用其他密码</red>"
  register-password-too-long: "<prefix><red>密码过长, 请使用其他密码</red>"
  # 注册和玩家改密命中弱密码黑名单时共用的提示
  register-password-unsafe: "<prefix><red>密码不安全, 请使用其他密码</red>"
  register-successful: "<prefix><green>注册成功</green>"
  register-title: "<prefix>"
  register-subtitle: "<green>请使用</green> <gold>/register <密码> <重复密码> 进行注册</gold>"
  register-successful-title: "<prefix>"
  register-successful-subtitle: "<green>注册成功</green>"
  unregister-successful: "<prefix><white><newline></white><green>账号注销成功</green>"
  unregister-usage: "<prefix><white>用法:</white> <gold>/unregister <当前密码> confirm</gold>"
  premium-successful: "<prefix><white><newline></white><green>账号状态已成功切换为</green> <gold>正版</gold>"
  already-premium: "<prefix><red>您的账号已经是</red> <gold>正版账号</gold>"
  not-premium: "<prefix><red>您的账号不是</red> <gold>正版账号</gold>"
  premium-usage: "<prefix><white>用法:</white> <gold>/premium <当前密码> confirm</gold>"
  event-cancelled: "<prefix><white>认证事件已取消</white>"
  force-unregister-successful: "<prefix><gold><player></gold> <green>的账号已注销</green>"
  force-unregister-kick: "<prefix><white><newline></white><green>管理员已注销您的账号</green>"
  force-unregister-not-successful: "<prefix><red>无法注销</red> <gold><player></gold><red>, 该玩家可能从未进入过此服务器</red>"
  force-unregister-usage: "<prefix><white>用法:</white> <gold>/forceunregister <玩家名称></gold>"
  registrations-disabled-kick: "<prefix><white>当前已关闭注册</white>"
  change-password-successful: "<prefix><green>密码修改成功</green>"
  # 如果 config.yml 中的 main.change-password-need-old-password 设置为 false, 请移除 <旧密码> 参数
  change-password-usage: "<prefix><white>用法:</white> <gold>/changepassword <旧密码> <新密码></gold>"
  force-change-password-successful: "<prefix><green>已成功修改玩家</green> <gold><player></gold> <green>的密码</green>"
  force-change-password-message: "<prefix><green>管理员已将您的密码修改为</green> <gold><password></gold>"
  force-change-password-not-successful: "<prefix><red>无法修改</red> <gold><player></gold> <red>的密码, 该玩家可能从未进入过此服务器</red>"
  force-change-password-not-registered: "<prefix><red>玩家</red> <gold><player></gold> <red>尚未注册</red>"
  force-change-password-usage: "<prefix><white>用法:</white> <gold>/forcechangepassword <玩家名称> <新密码></gold>"
  force-register-usage: "<prefix><white>用法: </white><gold>/forceregister <玩家名称> <密码></gold>"
  force-register-incorrect-nickname: "<prefix><red>玩家名称包含不允许的字符</red>"
  force-register-taken-nickname: "<prefix><red>此玩家名称已被占用</red>"
  force-register-successful: "<prefix><green>已成功注册玩家</green> <gold><player></gold>"
  force-register-not-successful: "<prefix><red>无法注册玩家</red> <gold><player></gold>"
  force-login-usage: "<prefix><white>用法:</white> <gold>/forcelogin <玩家名称></gold>"
  force-login-successful: "<prefix><green>已成功认证玩家 </green><gold><player></gold>"
  force-login-unknown-player: "<prefix><red>找不到正在认证的玩家 </red><gold><player></gold>"
  totp: "<prefix><white> 请使用 </white><gold>/2fa <验证码> 输入双重验证的动态验证码</gold>"
  totp-title: "<prefix>"
  totp-subtitle: "<green>请使用 </green><gold>/2fa <验证码> 输入双重验证的动态验证码</gold>"
  totp-successful: "<prefix><green>双重验证已启用</green>"
  totp-disabled: "<prefix><green>双重验证已关闭</green>"
  # 如果 config.yml 中的 main.totp-need-password 设置为 false, 请移除 <当前密码> 参数
  totp-usage: "<prefix><white>用法: </white><gold>/2fa enable <当前密码></gold><white> 或 </white><gold>/2fa disable <验证码></gold>"
  totp-wrong: "<prefix><red>双重验证的动态验证码错误</red>"
  totp-already-enabled: "<prefix><red>双重验证已启用, 可使用 </red><gold>/2fa disable <验证码></gold><red> 关闭</red>"
  totp-qr: "<prefix><white> 点击此处在浏览器中打开双重验证二维码</white>"
  # 可用标签: <secret> 为双重验证密钥, 不是动态验证码
  totp-token: "<prefix><green>您的双重验证密钥 </green><gray>(点击复制)</gray><green>: </green><gold><secret></gold>"
  totp-recovery: "<prefix><green>您的恢复码</green> <gray>(点击复制)</gray><green>: </green><gold><recovery_codes></gold>"
  destroy-session-successful: "<prefix><yellow>登录会话已注销, 重新连接后需要再次登录</yellow>"
  help-header: "<yellow>您正在使用 BayMcAuth</yellow>"
  help-copyright: "<yellow>(C) 2026 Konsheng</yellow>"
  help-website: "<green>https://github.com/konsheng/BayMcAuth</green>"
  help-available-subcommands: "<white>可用的子命令: </white>"
  help-no-available-subcommands: "<white>当前没有您可以使用的子命令</white>"
  help-reload-description: "<yellow>重新加载配置</yellow>"
  reload-failed: "<prefix><red>配置重载失败: <reason></red>"
